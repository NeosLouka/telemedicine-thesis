spring:
  application:
    name: telemedicine-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/telemedicine_db
    username: telemedicine_user
    password: telemedicine_password
    driver-class-name: org.postgresql.Driver

  hikari:
    maximum-pool-size: 10
    max-lifetime: 300000          # 5 minutes, below typical Postgres idle kill
    keepalive-time: 60000         # ping every 60s so the connection stays alive
    connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  logging:
    level:
      org.flywaydb: DEBUG

  modulith:
    events:
      completion-mode: update
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      republish-outstanding-events-on-restart: true # Not recommended in multi-instance deployments
#      staleness:
#        check-interval: 1m # Staleness Monitor wake up every 1m
#        published: 2m      # Stacked for 2m events with that status considered stale
#        processing: 2m
#        resubmitted: 2m

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false




server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      spring.security.authorizations: false
  tracing:
    sampling:
      probability: 1.0
    skip-pattern: "/actuator/**" # to skip tracing prometheus requests
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans


aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  region: eu-north-1
  s3:
    bucket: ${AWS_S3_BUCKET:local-demo-registration-documents}

gcp:
  firebase:
    service-account: ${FIREBASE_SERVICE_ACCOUNT:classpath:firebase/service-account.json}

video-provider:
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    api-key: ${TWILIO_API_KEY:}
    api-secret: ${TWILIO_API_SECRET:}

admin:
  registration-secret: ${ADMIN_REGISTRATION_SECRET:local-demo-admin-secret}

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration-ms: 1800000

app:
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
    subjects:
      welcome: "Welcome to UniHealth Telemedicine"
      doctor-approved: "Your UniHealth doctor account has been approved"
      otp-code: "UniHealth password reset verification code"
  twilio:
    webhook-base-url: ${TWILIO_WEBHOOK_BASE_URL:http://localhost:8080}

  cache:
    type: caffeine


